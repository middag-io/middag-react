name: CI

# PR gate. publish.yml runs on push to main and gates only `tsc` + contract
# drift before publishing — it skips test/lint/build. This workflow is the
# pre-merge gate: every pull request targeting main must pass the same checks
# the local git hooks enforce, so a clone without hooks (or a fork) can't land
# a broken tree.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check + drift + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # typecheck + typecheck:tests + typecheck:demo + lint + format:check
      # (same as the pre-commit/pre-push hooks).
      - name: Static checks
        run: npm run check

      # WCAG contrast of the theme tokens (text 4.5:1, focus ring 3:1) in
      # light and dark mode. The same check runs in the vitest suite; this
      # step prints the measured table in the job log.
      - name: Theme contrast gate
        run: npm run theme:contrast

      # Generated contracts must stay in sync with the php-ui schema mirror
      # committed in docs/public/schemas/.
      - name: Contracts drift gate
        run: npm run gen:contracts:check

      # packages/contracts/schema must equal the php-ui release recorded in
      # schema/SOURCE.json (fetched from GitHub at the recorded commit).
      - name: Contracts mirror provenance
        run: npm run contracts:verify-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A mirror change must not break the wire without an x-contract-version
      # bump (removed $def or field, field made required, narrowed type).
      - name: Contracts compatibility with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_DIR=$(mktemp -d)
          for f in page-contract.json fragment.json shared-props.json; do
            if ! git show "FETCH_HEAD:packages/contracts/schema/$f" > "$BASE_DIR/$f" 2>/dev/null; then
              echo "No $f in the contracts mirror on $BASE_REF yet; nothing to compare."
              exit 0
            fi
          done
          # The base mirror's producer tag: once it is at 2.0.0-rc.1 or later,
          # a break is refused whatever the new tag says.
          git show "FETCH_HEAD:packages/contracts/schema/SOURCE.json" > "$BASE_DIR/SOURCE.json" 2>/dev/null || rm -f "$BASE_DIR/SOURCE.json"
          npm run contracts:compat -- --base "$BASE_DIR"

      # Includes the accessibility gate (tests/a11y: axe-core, no serious or
      # critical violation) and the contrast suite (tests/scripts).
      # Runs the full suite once WITH coverage so the regression floor
      # (vitest.config.ts coverage.thresholds ≈ baseline − 2pp) gates the PR.
      # A drop below the floor fails here; raise the floor as coverage grows.
      - name: Unit tests + coverage gate
        run: npm run test:coverage

      # npm dependency audit through the node-npm-scan composite of the public
      # middag-io/actions repository, called by its major tag. It reads
      # package-lock.json only (runtime and dev dependencies) and fails on a
      # critical or high advisory. It depends on the npm registry, so it runs
      # last and even after an earlier failure.
      - name: npm audit
        if: ${{ !cancelled() }}
        uses: middag-io/actions/node-npm-scan@node-npm-scan-v1
        with:
          blocking-severities: critical, high

  build:
    name: build (lib + docs payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build @middag-io/react (dist-lib)
        run: npm run build

      # Same guard as the release: the public npm copy (staged without
      # publishConfig/scripts) must keep the source dependencies, files and
      # exports (scripts/npm-public-package.mjs).
      - name: Guard public npm package manifest
        run: |
          STAGE_DIR=$(mktemp -d)
          node scripts/npm-public-package.mjs stage "$STAGE_DIR"
          node scripts/npm-public-package.mjs verify "$STAGE_DIR"

      # @middag-io/ui-contracts: build, tarball contents (no premium schema or
      # $def) and a clean install from public npm, imported and type-checked.
      - name: Build + pack check @middag-io/ui-contracts
        run: |
          npm run contracts:build
          npm run contracts:pack-check

      # @middag-io/ui-contracts-codegen: the tarball holds only bin/ and lib/,
      # installs from public npm on its own and its CLI generates a package.
      - name: Pack check @middag-io/ui-contracts-codegen
        run: npm run codegen:pack-check

      # The docs payload build runs the FREE-only deny-list verification
      # (scripts/verify-docs-payload.mjs) — catches internal material leaking
      # into the public docs payload before it ever reaches a release.
      - name: Build + verify docs payload
        run: npm run docs:build
